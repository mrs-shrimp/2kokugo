const ALL=[];for(const level in RAW){RAW[level].forEach(rawText=>ALL.push({raw:rawText}));}
const app=document.getElementById('app');
const ruby=s=>s.replace(/([一-龠々]+)\[([^\]]+)\]/g,'<ruby>$1<rt>$2</rt></ruby>');
const parse=s=>s.split(' ').map(part=>{const n=part.lastIndexOf(':');return {text:part.slice(0,n),kind:part.slice(n+1)};});
const isPredicate=k=>k==='p'||k==='q'||k==='n';
let current=null,index=-1;
function explanation(tokens,chosen,mode,correct){
 const selected=tokens[chosen],subject=tokens.find(t=>t.kind==='s'),predicate=tokens.find(t=>isPredicate(t.kind));
 const subj='「'+subject.text.replace(/[。]$/,'').replace(/[はが]$/,'')+'」';
 const pred='「'+predicate.text.replace(/[。]$/,'')+'」';
 const label='「'+selected.text.replace(/[。]$/,'')+'」';
 const role={m:'どんな',w:'どこで・どこに',o:'何を',h:'どのように',t:'いつ',c:'だれと'};
 if(correct&&mode==='s')return `正解！ ${label}は、「だれが・何が」をあらわすことばだよ。これが主語だね。`;
 if(correct)return `正解！ ${label}は、${subj}がどうするのか・どんなようすなのか・何なのかをあらわすことば。これが述語だよ。`;
 if(mode==='s'){
  if(isPredicate(selected.kind))return `${label}は「どうする・どんなだ・何だ」をあらわす述語だよ。主語は「だれが・何が」をあらわすことばだね。<em>この文の主語は ${subj} だよ。</em>`;
  return `${label}は「${role[selected.kind]||'ほかのこと'}」をあらわすことばだよ。「だれが・何が」ではないので、主語ではないよ。<em>この文の主語は ${subj} だよ。</em>`;
 }
 if(selected.kind==='s')return `${label}は「だれが・何が」をあらわす主語だよ。<em>述語は、${subj}がどうするのかをあらわす ${pred} だね。</em>`;
 return `${label}は「${role[selected.kind]||'ほかのこと'}」をあらわすことばだよ。述語ではないね。<em>この文で、${subj}がどうするのか・どんなようすなのかをあらわすのは ${pred} だよ。</em>`;
}
function show(){
 const t=current.tokens,mode=current.mode;
 app.innerHTML=ruby(`<section class="intro"><h1>主語と述語を見つけよう！</h1><div class="ask">${mode==='s'?'主語を見つけよう！':'述語を見つけよう！'}</div><div>文の中から、あてはまることばを一つえらんでね。</div></section><section class="sent">${t.map((v,i)=>`<button type="button" class="w" data-index="${i}">${v.text}</button>`).join('')}</section><div id="feedback"></div><div class="note">ことばを一つえらぶと、正解と理由が出ます。</div>`);
 document.querySelectorAll('.w').forEach(button=>button.addEventListener('click',()=>answer(Number(button.dataset.index))));
}
function nextQuestion(){
 index=(index+1)%ALL.length;
 const tokens=parse(ALL[index].raw);
 current={tokens,mode:Math.random()<.5?'s':'p',done:false};
 show();
}
function answer(i){
 if(current.done)return;current.done=true;
 const {tokens,mode}=current;
 const correct=mode==='s'?tokens[i].kind==='s':isPredicate(tokens[i].kind);
 const answerIndex=tokens.findIndex(t=>mode==='s'?t.kind==='s':isPredicate(t.kind));
 const buttons=[...document.querySelectorAll('.w')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===answerIndex)b.classList.add(mode==='s'?'correct-subject':'correct-predicate');});
 if(!correct)buttons[i].classList.add('wrong');
 const feedback=document.getElementById('feedback');
 feedback.innerHTML=ruby(`<div class="feedback ${correct?'ok':'ng'}">${correct?'◎ せいかい！':'おしい！正解を見てみよう。'}<br>${explanation(tokens,i,mode,correct)}</div><div class="actions"><button type="button" class="next" id="next">次の問題へ</button></div>`);
 document.getElementById('next').addEventListener('click',nextQuestion);
}
nextQuestion();
</script></main></body></html>
