/* ===== UI refresh: ことばの大ぼうけん ===== */
:root{
  --shadow:0 16px 38px rgba(29,76,52,.13),0 3px 8px rgba(29,76,52,.05);
  --radius:26px;
}
html{
  background:#e8f2e3;
  background-image:radial-gradient(ellipse at 8% 8%,#fff8d9 0,transparent 30%),radial-gradient(ellipse at 94% 28%,#d8edf4 0,transparent 29%),linear-gradient(145deg,#eef7e9,#fbf6e6 52%,#e5f3ed);
  background-attachment:fixed;
}
body{
  background:transparent;
  position:relative;
  isolation:isolate;
}
body::before{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.22;
  background-image:radial-gradient(#6f9d79 1.1px,transparent 1.1px),radial-gradient(#dfb64f 1px,transparent 1px);
  background-size:31px 31px,47px 47px;background-position:0 0,13px 19px;
  mask-image:linear-gradient(to bottom,transparent,#000 12%,#000 85%,transparent);
}
#app{position:relative;z-index:0}
.topbar{margin-bottom:22px}
.brand-mark{
  background:linear-gradient(145deg,#1e7656,#104431);border:2px solid #f8dc7a;
  box-shadow:0 5px 0 #0c3729,0 0 0 5px #e5f3db,0 7px 18px #1f634022;
  transition:transform .25s ease,box-shadow .25s ease;
}
.brand-mark:hover{transform:rotate(-7deg) scale(1.04);box-shadow:0 5px 0 #0c3729,0 0 0 6px #fff0b3,0 9px 22px #1f634033}
.brand-name{color:#174d39;text-shadow:0 1px 0 #fff}
.tiny-btn,.nav-btn{
  border:1px solid #d6e3d1;box-shadow:0 3px 0 #dfe8da;background:linear-gradient(#fffefa,#f5f8ee);
  transition:transform .15s ease,box-shadow .15s ease,border-color .15s ease;
}
.tiny-btn:hover,.nav-btn:hover{transform:translateY(-2px);border-color:#9fcaab;box-shadow:0 5px 0 #dfe8da}
.hero{
  isolation:isolate;border:1px solid #b4d7a9;
  background:radial-gradient(ellipse at 78% 10%,#74b96c66 0,transparent 34%),radial-gradient(ellipse at 12% 105%,#0d382b 0,transparent 42%),linear-gradient(122deg,#123f31 0%,#1e6749 48%,#4a9860 100%);
  box-shadow:0 18px 0 #dce9d3,0 23px 42px #214e351b,inset 0 1px 0 #ffffff2e;
}
.hero::before{
  width:280px;height:280px;right:-70px;top:-115px;
  background:radial-gradient(circle at 35% 35%,#fff7ca36,transparent 63%);
  border:1px solid #ffffff20;box-shadow:0 0 0 22px #ffffff08,0 0 0 46px #ffffff06;
  animation:mapGlow calc(9s * var(--motion)) ease-in-out infinite alternate;
}
.hero::after{
  width:230px;height:230px;right:95px;bottom:-165px;
  background:radial-gradient(circle,#f7d46c24,transparent 67%);
  box-shadow:0 0 0 18px #ffffff04;
}
.hero-inner{max-width:790px}
.eyebrow{
  color:#fff4bd;border-color:#f6d97888;background:#fff8d516;
  box-shadow:inset 0 1px 0 #ffffff25,0 3px 10px #082c2014;
}
.hero h1{
  text-shadow:0 4px 0 #0e3d2d,0 8px 24px #06271e5c;
  letter-spacing:.045em;
}
.hero p{color:#f0fae9;text-shadow:0 1px 4px #083b2a35}
.hero-art{filter:drop-shadow(0 9px 12px #082e1e35);transform-origin:65% 80%;animation:heroFloat calc(4.8s * var(--motion)) ease-in-out infinite alternate}
.panel{
  position:relative;border:1px solid #e2e8d7;
  box-shadow:0 8px 0 #e3ebdb,0 13px 28px #284c3210,inset 0 1px 0 #fff;
}
.panel::before{
  content:"";position:absolute;top:0;left:24px;right:24px;height:3px;border-radius:0 0 9px 9px;
  background:linear-gradient(90deg,#8ecb8b,#f2ce61,#f6a38a,#9acfe4);opacity:.78;pointer-events:none;
}
.panel-head{position:relative}
.section-label{color:#2a815c}
.primary{
  background:linear-gradient(180deg,#ffe17b,#f3bd43);border:1px solid #e2ae36;
  box-shadow:0 5px 0 #c89428,0 8px 15px #c894281c,inset 0 1px 0 #fff7c4;
}
.primary:hover{box-shadow:0 7px 0 #c89428,0 12px 18px #c8942830,inset 0 1px 0 #fff7c4}
.secondary{
  background:linear-gradient(180deg,#2e8962,#1c6248);border:1px solid #17533d;
  box-shadow:0 4px 0 #11412f,0 7px 14px #11412f18,inset 0 1px 0 #ffffff2e;
}
.secondary:hover{box-shadow:0 6px 0 #11412f,0 11px 17px #11412f27}
.soft-btn{background:linear-gradient(180deg,#f5fbf0,#e2f0e1);border-color:#cfe2ce;box-shadow:0 3px 0 #dce8d8}
.soft-btn:hover{box-shadow:0 5px 0 #dce8d8}
.welcome-grid .panel:first-child{background:linear-gradient(145deg,#fffef9,#fff8e4)}
.welcome-grid .welcome-side{background:linear-gradient(145deg,#f8fff4,#edf8eb)}
.feature-mark{box-shadow:0 3px 0 #cfe5d0;border:1px solid #c7e1c8}
.stats-grid .stat{position:relative;overflow:hidden;box-shadow:inset 0 1px 0 #fff}
.stats-grid .stat::after{
  content:"";position:absolute;width:68px;height:68px;right:-24px;top:-25px;border-radius:50%;
  background:radial-gradient(circle,#ffffffa6,#ffffff00 72%);pointer-events:none;
}
.stats-grid .stat:nth-child(1){background:linear-gradient(145deg,#fff7cf,#fff0b0);border-color:#eddc9a}
.stats-grid .stat:nth-child(2){background:linear-gradient(145deg,#e1f5e7,#cfead8);border-color:#c5e1cd}
.stats-grid .stat:nth-child(3){background:linear-gradient(145deg,#e5f5fc,#d8edf7);border-color:#cce5ef}
.stats-grid .stat:nth-child(4){background:linear-gradient(145deg,#f0eaff,#e6dcff);border-color:#ddd0fa}
.xp-track{height:15px;border:2px solid #cfdfc9;background:#e6edde;box-shadow:inset 0 2px 4px #284b3215}
.xp-fill{background:linear-gradient(90deg,#f0b93c 0%,#ffdc65 48%,#c8e86f 100%);box-shadow:0 0 10px #f0c74d4d}
.mode-card{
  position:relative;isolation:isolate;overflow:hidden;border-radius:24px;

  transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease;
}
.mode-card::after{
  content:"";position:absolute;right:-32px;top:-36px;width:118px;height:118px;border-radius:50%;
  background:radial-gradient(circle at 32% 35%,#ffffffd9,#ffffff16 66%);z-index:-1;pointer-events:none;

.area-card{

}
.area-card:hover:not(:disabled){transform:translateY(-4px) scale(1.012);border-color:#9bc9a3;box-shadow:0 8px 0 #dbe7d5,0 15px 24px #254d3216}
.area-card:disabled:hover{transform:none;box-shadow:0 5px 0 #e1e9da,0 8px 18px #254d320b}
.area-icon{box-shadow:0 4px 0 #24442b13,inset 0 1px 0 #ffffffb8;border:1px solid #ffffffb8}
.area-state{box-shadow:inset 0 1px 0 #ffffffad}
.question-card{
  position:relative;isolation:isolate;overflow:hidden;
  background:linear-gradient(155deg,#fff 0%,#fffef8 75%,#f8fbef 100%);
  border:1px solid #dce7d7;box-shadow:0 7px 0 #e4eddd,0 13px 28px #264f3510,inset 0 1px 0 #fff;
}
.question-card::before{
  content:"";position:absolute;right:-35px;top:-55px;width:170px;height:170px;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#ffdc7038,transparent 68%);z-index:-1;pointer-events:none;
}
.question-kicker{border:1px solid #c9e5c9;box-shadow:inset 0 1px 0 #fff;background:linear-gradient(180deg,#edf9e8,#dcefdc)}
.question-prompt{letter-spacing:.015em;text-wrap:pretty}
.choice-btn,.match-choice,.sort-chip{
  transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease,filter .16s ease;
}
.choice-btn{border-radius:20px;box-shadow:0 5px 0 #e2e8da,0 8px 13px #2b4c3210,inset 0 1px 0 #fff;border-color:#dce7d7}
.choice-btn:hover:not(:disabled){transform:translateY(-3px) scale(1.01);border-color:#a6cba5;box-shadow:0 8px 0 #dce6d4,0 13px 18px #2b4c3219;filter:saturate(1.06)}
.choice-btn:active:not(:disabled){transform:translateY(1px) scale(.995);box-shadow:0 2px 0 #dce6d4}
.match-choice{box-shadow:0 4px 0 #e2e9df,inset 0 1px 0 #fff;background:linear-gradient(180deg,#fff,#f8fbf5)}
.match-choice:hover:not(:disabled){transform:translateY(-2px);border-color:#93c49a;box-shadow:0 6px 0 #e2e9df}
.sort-chip{box-shadow:0 4px 0 #e2e9df,inset 0 1px 0 #fff}
.sort-chip:hover:not(:disabled){transform:translateY(-2px);border-color:#99c5a0;box-shadow:0 6px 0 #e2e9df}
.sort-chip.selected{box-shadow:0 4px 0 #dfc05e,0 0 0 3px #fff1b7}
.sort-bucket{box-shadow:inset 0 1px 0 #fff,0 4px 0 #dce9d8;transition:transform .15s ease,box-shadow .15s ease,background .15s ease}
.sort-bucket:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 6px 0 #dce9d8}
.feedback{box-shadow:0 5px 0 #dfead7,inset 0 1px 0 #fff}
.feedback h3{letter-spacing:.01em}
.feedback.level-up{background:radial-gradient(circle at 95% 0,#fff3b9 0,transparent 29%),linear-gradient(135deg,#f5ffef,#e7f6e3);border-color:#a9d5a8;animation:feedbackPop calc(.42s * var(--motion)) ease-out}
.feedback.bad{box-shadow:0 4px 0 #f0e2c7,inset 0 1px 0 #fff}
.hint-box{box-shadow:inset 0 1px 0 #fff8de}
.result-score{position:relative}
.score-disc{border:5px solid #fff5c6;box-shadow:0 7px 0 #dba83d,0 13px 24px #bc8a262c,inset 0 2px 0 #fff9d9;position:relative}
.score-disc::after{content:"✦";position:absolute;right:-8px;top:1px;font-size:31px;color:#fff9d7;text-shadow:0 2px 3px #a87820;transform:rotate(12deg)}
.reward-chip{background:linear-gradient(180deg,#f0fae9,#dfefda);border-color:#cfe5c9;box-shadow:0 3px 0 #d7e6d0}
.word-card{box-shadow:0 4px 0 #e8ece1,inset 0 1px 0 #fff;transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease}
.word-card:hover{transform:translateY(-3px);border-color:#bdd9b9;box-shadow:0 7px 0 #e3eadc,0 12px 18px #254d3210}
.filter-btn{box-shadow:0 2px 0 #e8ece3;transition:transform .15s ease,box-shadow .15s ease,background .15s ease}
.filter-btn:hover{transform:translateY(-1px);box-shadow:0 4px 0 #e8ece3}
.filter-btn.active{box-shadow:0 3px 0 #155039}
.history-stat{background:linear-gradient(145deg,#f7fbf1,#eaf4e7);box-shadow:inset 0 1px 0 #fff}
.history-row{box-shadow:0 3px 0 #edf0e8,inset 0 1px 0 #fff}
.empty-state{background:linear-gradient(145deg,#fffef9,#f6fbf1);box-shadow:inset 0 1px 0 #fff}
.notice{box-shadow:inset 0 1px 0 #fff8d7}
.setting-row{border-bottom-color:#e1e9db}
.toggle{box-shadow:inset 0 1px 0 #ffffffa8,0 2px 0 #d6dfd1}
.toggle.on{box-shadow:inset 0 1px 0 #fff,0 2px 0 #bfdfc3}
button:focus-visible,input:focus-visible{outline-color:#e6ae25;box-shadow:0 0 0 5px #ffe69b70}
@keyframes mapGlow{from{transform:translate3d(0,0,0) scale(1)}to{transform:translate3d(-8px,7px,0) scale(1.06)}}
@keyframes heroFloat{from{transform:translateY(0) rotate(-1deg)}to{transform:translateY(-5px) rotate(1deg)}}
@keyframes feedbackPop{from{opacity:.65;transform:translateY(8px) scale(.99)}to{opacity:1;transform:translateY(0) scale(1)}}
@media(max-width:760px){

@media(max-width:460px){

  .hero::before,.hero-art{animation:none!important}

}

function safeLoad(){
 try{
  const raw=localStorage.getItem(STORAGE_KEY);
  if(!raw) return DEFAULT_STATE();
  const data=JSON.parse(raw);
  if(!data || typeof data!=='object' || Array.isArray(data)) throw new Error('bad save');
  const base=DEFAULT_STATE();
  const merged={...base,...data,version:SAVE_VERSION};
  if(typeof merged.playerName!=='string') merged.playerName='';
  merged.playerName=sanitizeName(merged.playerName);
  if(!Number.isFinite(Number(merged.xp))||Number(merged.xp)<0) merged.xp=0; else merged.xp=Math.floor(Number(merged.xp));
  if(!Number.isFinite(Number(merged.playCount))||Number(merged.playCount)<0) merged.playCount=0; else merged.playCount=Math.floor(Number(merged.playCount));
  for(const k of ['earnedTitles','clearedAreas','clearedMissions','seenQuestionIds','xpAwardedQuestionIds','coinAwardedQuestionIds','ownedShopItems','answerHistory','sessions']) if(!Array.isArray(merged[k])) merged[k]=[];
  merged.earnedTitles=merged.earnedTitles.filter(x=>typeof x==='string').slice(-100);
  merged.clearedAreas=[...new Set(merged.clearedAreas.filter(x=>AREA_INFO.some(a=>a.id===x)))];
  merged.clearedMissions=[...new Set(merged.clearedMissions.filter(x=>typeof x==='string'))];
  merged.seenQuestionIds=[...new Set(merged.seenQuestionIds.filter(id=>!!getQuestion(id)))];
  merged.xpAwardedQuestionIds=[...new Set(merged.xpAwardedQuestionIds.filter(id=>!!getQuestion(id)))];
  merged.coinAwardedQuestionIds=[...new Set(merged.coinAwardedQuestionIds.filter(id=>!!getQuestion(id)))];
  if(!Number.isFinite(Number(merged.coins))||Number(merged.coins)<0) merged.coins=0; else merged.coins=Math.floor(Number(merged.coins));
  merged.ownedShopItems=[...new Set(merged.ownedShopItems.filter(id=>SHOP_ITEMS.some(item=>item.id===id)))];
  if(!merged.equippedShopItems||typeof merged.equippedShopItems!=='object'||Array.isArray(merged.equippedShopItems))merged.equippedShopItems={};
  for(const [slot,id] of Object.entries(merged.equippedShopItems)){
   const item=SHOP_ITEMS.find(x=>x.id===id);
   if(!item||item.slot!==slot||!merged.ownedShopItems.includes(id))delete merged.equippedShopItems[slot];
  }
  // Upgrade older saves without deleting their learning history, coins, or legacy shop data.
  if(!Array.isArray(merged.ownedBackgrounds))merged.ownedBackgrounds=['bg1'];
  merged.ownedBackgrounds=[...new Set(merged.ownedBackgrounds.filter(id=>CAMP_BACKGROUNDS.some(x=>x.id===id)))];
  if(!merged.ownedBackgrounds.includes('bg1'))merged.ownedBackgrounds.unshift('bg1');
  if(!Array.isArray(merged.ownedTents))merged.ownedTents=['tent1'];
  merged.ownedTents=[...new Set(merged.ownedTents.filter(id=>CAMP_TENTS.some(x=>x.id===id)))];
  if(!merged.ownedTents.includes('tent1'))merged.ownedTents.unshift('tent1');
  if(!CAMP_BACKGROUNDS.some(x=>x.id===merged.equippedBackground&&merged.ownedBackgrounds.includes(x.id)))merged.equippedBackground='bg1';
  const loadedLevel=getLevelFromXP(merged.xp);
  const restoredTent=CAMP_TENTS.find(x=>x.id===merged.equippedTent&&merged.ownedTents.includes(x.id)&&x.level<=loadedLevel);
  merged.equippedTent=restoredTent?restoredTent.id:'tent1';
  merged.answerHistory=merged.answerHistory.filter(x=>x&&typeof x==='object'&&!Array.isArray(x)).slice(-1200);
  merged.sessions=merged.sessions.filter(x=>x&&typeof x==='object'&&!Array.isArray(x)).slice(-300);
  for(const k of ['questionStats','wordStats']) if(!merged[k]||typeof merged[k]!=='object'||Array.isArray(merged[k])) merged[k]={};
  for(const [id,st] of Object.entries(merged.questionStats)){
   if(!getQuestion(id)||!st||typeof st!=='object'||Array.isArray(st)){delete merged.questionStats[id];continue;}
   for(const field of ['seen','attempts','wrong','solved','firstTryCorrect','hintedCorrect','revealed']){const n=Number(st[field]);st[field]=Number.isFinite(n)&&n>0?Math.floor(n):0;}
   st.reviewNeeded=!!st.reviewNeeded;
  }
  const knownWords=new Set(QUESTIONS.flatMap(q=>q.words||[]));
  for(const [word,st] of Object.entries(merged.wordStats)){
   if(!knownWords.has(word)||!st||typeof st!=='object'||Array.isArray(st)){delete merged.wordStats[word];continue;}
   st.seen=!!st.seen;st.mastered=!!st.mastered;st.reviewNeeded=!!st.reviewNeeded;
  }
  if(merged.activeSession&&typeof merged.activeSession==='object'&&!Array.isArray(merged.activeSession)){
   const as=merged.activeSession;
   if(!Array.isArray(as.answers)||!as.answers.every(x=>x&&typeof x==='object'&&!Array.isArray(x)))as.answers=[];
   if(!as.sortAssignments||typeof as.sortAssignments!=='object'||Array.isArray(as.sortAssignments))as.sortAssignments={};
   if(typeof as.sortSelectedChoice!=='string')as.sortSelectedChoice='';
   if(!Number.isFinite(Number(as.sortMistakes)))as.sortMistakes=0;
   if(!Number.isFinite(Number(as.sortAttempts)))as.sortAttempts=0;
   if(!as.choiceOrder||typeof as.choiceOrder!=='object'||Array.isArray(as.choiceOrder))as.choiceOrder={};
   else for(const [qid,order] of Object.entries(as.choiceOrder))if(!Array.isArray(order)||!getQuestion(qid))delete as.choiceOrder[qid];
  }
  merged.level=getLevelFromXP(merged.xp);
  if(merged.activeSession && !isRestorableSession(merged.activeSession)) merged.activeSession=null;
  return merged;
 }catch(e){
  try{const raw=localStorage.getItem(STORAGE_KEY);if(raw)localStorage.setItem(STORAGE_KEY+'_backup_'+Date.now(),raw);}catch(_e){}
  storageWarning='まえの きろくを よみこめませんでした。こわれた データは べつに のこし、あたらしい きろくで はじめます。';

 }

function sanitizeName(value){return String(value||'').normalize('NFKC').replace(/[^\u3040-\u309F\u30A0-\u30FFー 0-9A-Za-z._-]/g,'').trim().slice(0,12);}
function getLevelFromXP(xp){return Math.max(1,Math.floor(Math.max(0,Number(xp)||0)/100)+1);}
function xpProgress(xp){return Math.max(0,Math.min(100,(Number(xp)||0)%100));}
function levelTitle(level){return LEVEL_TITLES[Math.min(LEVEL_TITLES.length-1,Math.max(0,level-1))]||LEVEL_TITLES[0];}
function esc(value){return String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));}
function randShuffle(arr){const out=arr.slice();for(let i=out.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[out[i],out[j]]=[out[j],out[i]];}return out;}
function formatDate(value){if(!value)return 'きろくなし';const d=new Date(value);if(Number.isNaN(d.getTime()))return 'きろくなし';return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;}
function getArea(id){return AREA_INFO.find(a=>a.id===id)||AREA_INFO[0];}
function getQuestion(id){return QUESTIONS.find(q=>q.id===id)||null;}
function isRestorableSession(s){return !!(s&&typeof s==='object'&&!Array.isArray(s)&&Array.isArray(s.questionIds)&&s.questionIds.length>0&&s.questionIds.length<=10&&s.questionIds.every(id=>getQuestion(id))&&Number.isInteger(s.index)&&s.index>=0&&s.index<s.questionIds.length&&['answer','wrong','hint','correct','revealed'].includes(s.phase)&&['adventure','practice','weak'].includes(s.mode)&&AREA_INFO.some(a=>a.id===s.area)&&Array.isArray(s.answers)&&s.answers.every(a=>a&&typeof a==='object'&&!Array.isArray(a))&&(!s.sortAssignments||typeof s.sortAssignments==='object'&&!Array.isArray(s.sortAssignments))&&Number.isInteger(s.attemptsOnQuestion)&&s.attemptsOnQuestion>=0);}
function validateQuestionBank(){
 const issues=[];const ids=new Set();const prompts=new Set();const count={};
 for(const q of QUESTIONS){
  if(ids.has(q.id))issues.push({kind:'id',id:q.id,text:'おなじ ID が あります'});ids.add(q.id);
  if(prompts.has(q.prompt))issues.push({kind:'prompt',id:q.id,text:'おなじ もんだいが あります'});prompts.add(q.prompt);
  count[q.area]=(count[q.area]||0)+1;
  if(!AREA_INFO.some(a=>a.id===q.area))issues.push({kind:'area',id:q.id,text:'エリアが みつかりません'});
  if(!Array.isArray(q.choices)||q.choices.length!==4)issues.push({kind:'choices',id:q.id,text:'えらぶことばが 4こでは ありません'});
  else if(new Set(q.choices).size!==q.choices.length)issues.push({kind:'choices',id:q.id,text:'えらぶことばが かさなっています'});
  if(!q.choices.includes(q.answer))issues.push({kind:'answer',id:q.id,text:'こたえが えらぶことばに ありません'});
  for(const f of ['prompt','hint','explanation','word','meaning','example','format','concept'])if(typeof q[f]!=='string'||!q[f].trim())issues.push({kind:'field',id:q.id,text:`${f} が ありません`});
  if(!Array.isArray(q.words)||!q.words.length)issues.push({kind:'word',id:q.id,text:'ことばの きろくが ありません'});
  if(q.format==='category'&&(!q.sortLabel||!String(q.sortLabel).trim()))issues.push({kind:'sortLabel',id:q.id,text:'わける はこの なまえが ありません'});
  for(const [field,value] of Object.entries({prompt:q.prompt,choices:Array.isArray(q.choices)?q.choices.join(' / '):'',answer:q.answer,hint:q.hint,explanation:q.explanation,word:q.word,meaning:q.meaning,example:q.example,sortLabel:q.sortLabel||''})){
   const bad=findKanjiViolations(value);if(bad.length)issues.push({kind:'kanji',id:q.id,text:`${field} に きまりの そと の かんじ：${[...new Set(bad)].join('、')}`});
  }
 }
 for(const a of AREA_INFO)if((count[a.id]||0)<30)issues.push({kind:'count',id:a.id,text:`もんだいが ${count[a.id]||0}こです`});
 return {total:QUESTIONS.length,issues,counts:count};
}
function collectAuditTexts(){
 const out=[...STATIC_TEXTS,...AREA_INFO.flatMap(a=>[a.name,a.subtitle,a.desc]),...LEVEL_TITLES,...Object.values(TYPE_LABELS),...SHOP_ITEMS.flatMap(i=>[i.name,i.description,i.slotLabel]),...CAMP_BACKGROUNDS.flatMap(i=>[i.name,i.description]),...CAMP_TENTS.flatMap(i=>[i.name,i.description])];
 for(const q of QUESTIONS)out.push(q.prompt,...q.choices,q.answer,q.hint,q.explanation,q.word,q.meaning,q.example,q.sortLabel||'');
 out.push(appState.playerName||'');
 const active=document.getElementById('app');if(active)out.push(active.innerText||'');
 return out;
}
function findKanjiViolations(text){return Array.from(String(text||'')).filter(ch=>/[\u3400-\u9FFF\uF900-\uFAFF]/.test(ch)&&!LEVEL_12_KANJI.includes(ch));}
function runTextAudit(){
 const issues=[];const unique=new Set();
 for(const t of collectAuditTexts()){
  const bad=findKanjiViolations(t);if(bad.length){const key=t+'\u0000'+bad.join('');if(!unique.has(key)){unique.add(key);let suggestion=t;for(const [k,v]of Object.entries(HIRAGANA_SUGGESTIONS))suggestion=suggestion.replaceAll(k,v);if(suggestion===t)suggestion='ひらがなで かきなおす';issues.push({text:t,bad:[...new Set(bad)].join('、'),suggestion});}}
 }
 auditResult={checkedTextCount:collectAuditTexts().length,issues,questionCheck:validateQuestionBank()};return auditResult;
}

function chooseQuestions(area,mode){let pool=QUESTIONS.filter(q=>q.area===area&&validQuestionIds.has(q.id));if(pool.length<10)pool=QUESTIONS.filter(q=>validQuestionIds.has(q.id));const stats=appState.questionStats||{};const score=q=>{const s=stats[q.id]||{};const seen=Number(s.seen)||0;const wrong=Number(s.wrong)||0;const solved=Number(s.solved)||0;const due=s.reviewNeeded?15:0;const recency=s.lastSeen?Math.max(0,14-(Date.now()-new Date(s.lastSeen).getTime())/86400000):5;const levelFit=(q.difficulty<=appState.level?3:0);return due+wrong*3-solved*.55-seen*.65-recency*.25+levelFit+Math.random()*3;};return pool.slice().sort((a,b)=>score(b)-score(a)).slice(0,10).map(q=>q.id);}
function chooseWeakQuestions(){const stats=appState.questionStats||{};const all=QUESTIONS.filter(q=>validQuestionIds.has(q.id));const priority=q=>{const s=stats[q.id]||{};const wrong=Number(s.wrong)||0;const attempts=Number(s.attempts)||0;const solved=Number(s.solved)||0;const days=s.lastWrong?(Date.now()-new Date(s.lastWrong).getTime())/86400000:30;return (s.reviewNeeded?100:0)+wrong*7+Math.max(0,5-days*.2)+Math.max(0,attempts-solved)*2+Math.random()*1.5;};const failed=all.filter(q=>{const s=stats[q.id]||{};return s.reviewNeeded||(Number(s.wrong)||0)>(Number(s.solved)||0);}).sort((a,b)=>priority(b)-priority(a));let chosen=[];const addQ=q=>{if(q&&!chosen.includes(q.id)&&chosen.length<10)chosen.push(q.id);};
 for(const q of failed){addQ(q);if(chosen.length>=10)break;const variants=all.filter(v=>v.concept===q.concept&&v.id!==q.id).sort((a,b)=>((stats[a.id]?.seen||0)-(stats[b.id]?.seen||0)));for(const v of variants)addQ(v);if(chosen.length>=10)break;}
 if(chosen.length<10){const unseen=all.filter(q=>!chosen.includes(q.id)&&!(stats[q.id]?.seen)).sort((a,b)=>a.difficulty-b.difficulty);for(const q of unseen)addQ(q);}
 if(chosen.length<10){for(const q of all.slice().sort((a,b)=>priority(b)-priority(a)))addQ(q);}
 return chosen.slice(0,10);
}

 return `<section class="panel"><div class="game-head"><div><div class="section-label">${esc(area.name)}</div><h1 class="screen-title">ことばを さがそう</h1></div><div class="progress-text">${title} / ${s.questionIds.length} もん</div></div><div class="progress-track" aria-label="すすみぐあい"><div class="progress-fill" style="width:${Math.round(progress)}%"></div></div><div class="question-card"><div class="question-kicker">${esc(TYPE_LABELS[q.format]||'ことばを えらぼう')} ・ レベル ${q.difficulty}</div><p class="question-prompt">${esc(q.prompt)}</p>${questionControls}</div>${feedback}<div class="button-row" style="margin-top:18px;justify-content:space-between"><button class="soft-btn" data-action="hintQuick" ${answered?'disabled':''}>ヒントを みる</button><button class="soft-btn" data-action="exitGame">ホームへ もどる</button></div></section>`;
}
function onSortSelect(choice){const s=appState.activeSession;if(!s||s.phase!=='answer'||s.doneCurrent)return;const q=currentQ();if(!q||(q.format!=='category'&&q.format!=='odd')||!q.choices.includes(choice)||Object.prototype.hasOwnProperty.call(s.sortAssignments||{},choice))return;s.sortSelectedChoice=choice;s.sortMessage=null;saveState();render();}
function recordSortPlacement(q,choice,bucket,correct){const st=appState.questionStats[q.id]||{seen:1,attempts:0,wrong:0,solved:0,firstTryCorrect:0,hintedCorrect:0,reviewNeeded:false};st.attempts=(Number(st.attempts)||0)+1;st.lastAttempt=new Date().toISOString();if(!correct){st.wrong=(Number(st.wrong)||0)+1;st.lastWrong=new Date().toISOString();st.reviewNeeded=true;for(const w of q.words||[]){const ws=appState.wordStats[w]||{seen:true,mastered:false,reviewNeeded:false};ws.seen=true;ws.reviewNeeded=true;ws.mastered=false;appState.wordStats[w]=ws;}}appState.questionStats[q.id]=st;appState.answerHistory.push({qid:q.id,area:q.area,choice:`${choice} → ${bucket}`,correct,sort:true,at:new Date().toISOString(),hintUsed:!!appState.activeSession.hintUsed,attempt:(Number(appState.activeSession.sortAttempts)||0)});appState.answerHistory=appState.answerHistory.slice(-1200);saveState();}
function onSortBucket(bucket){const s=appState.activeSession;if(!s||s.phase!=='answer'||s.doneCurrent||!s.sortSelectedChoice)return;const q=currentQ();if(!q||(q.format!=='category'&&q.format!=='odd'))return;const choice=s.sortSelectedChoice;const expected=q.format==='category'?(choice===q.answer?'target':'other'):(choice===q.answer?'odd':'group');const correct=bucket===expected;s.sortAttempts=(Number(s.sortAttempts)||0)+1;s.attemptsOnQuestion=(Number(s.attemptsOnQuestion)||0)+1;recordSortPlacement(q,choice,bucket,correct);
 if(!correct){s.sortMistakes=(Number(s.sortMistakes)||0)+1;s.sortMessage={bad:true,text:'おっと、ちがう はこみたい。ことばを よくみて、もういちど やってみよう。'};saveState();render();return;}
 s.sortAssignments[choice]=bucket;s.sortSelectedChoice='';s.sortMessage={bad:false,text:'いいね！ ひとつ わけられたよ。'};
 if(Object.keys(s.sortAssignments).length===4){const clean=(Number(s.sortMistakes)||0)===0&&!s.hintUsed;const st=appState.questionStats[q.id]||{seen:1,attempts:0,wrong:0,solved:0,firstTryCorrect:0,hintedCorrect:0,reviewNeeded:false};st.solved=(Number(st.solved)||0)+1;st.lastCorrect=new Date().toISOString();if(clean)st.firstTryCorrect=(Number(st.firstTryCorrect)||0)+1;else if(s.hintUsed)st.hintedCorrect=(Number(st.hintedCorrect)||0)+1;st.reviewNeeded=!clean;appState.questionStats[q.id]=st;for(const w of q.words||[]){const ws=appState.wordStats[w]||{seen:true,mastered:false,reviewNeeded:false};ws.seen=true;ws.mastered=clean;ws.reviewNeeded=!clean;if(clean)ws.lastMastered=new Date().toISOString();appState.wordStats[w]=ws;}const oldLevel=appState.level;const xp=addXP(q,clean?10:6);s.lastEarnedXP=xp;s.lastEarnedCoins=awardCoins(q,clean?7:4);s.lastNewLevel=getLevelFromXP(appState.xp)>oldLevel;s.phase='correct';s.lastCorrect=true;s.doneCurrent=true;s.answers.push({qid:q.id,solved:true,choice:q.answer,attempts:s.sortAttempts,hintUsed:s.hintUsed,firstTryCorrect:clean});if(s.lastNewLevel){const title=levelTitle(appState.level);if(!appState.earnedTitles.includes(title))appState.earnedTitles.push(title);}s.sortMessage={bad:false,text:'ぜんぶ わけられたよ！'};playTone(true);}
 saveState();render();}
function recordAttempt(q,choice,correct){const s=appState.questionStats[q.id]||{seen:1,attempts:0,wrong:0,solved:0,firstTryCorrect:0,hintedCorrect:0,reviewNeeded:false};s.attempts=(Number(s.attempts)||0)+1;s.lastAttempt=new Date().toISOString();if(correct){s.solved=(Number(s.solved)||0)+1;s.lastCorrect=new Date().toISOString();const cleanFirst=appState.activeSession.attemptsOnQuestion===1&&!appState.activeSession.hintUsed;if(cleanFirst)s.firstTryCorrect=(Number(s.firstTryCorrect)||0)+1;else if(appState.activeSession.hintUsed)s.hintedCorrect=(Number(s.hintedCorrect)||0)+1;s.reviewNeeded=!cleanFirst;}else{s.wrong=(Number(s.wrong)||0)+1;s.lastWrong=new Date().toISOString();s.reviewNeeded=true;}appState.questionStats[q.id]=s;appState.answerHistory.push({qid:q.id,area:q.area,choice,correct,at:new Date().toISOString(),hintUsed:!!appState.activeSession.hintUsed,attempt:appState.activeSession.attemptsOnQuestion});appState.answerHistory=appState.answerHistory.slice(-1200);for(const w of q.words||[]){const ws=appState.wordStats[w]||{seen:true,mastered:false,reviewNeeded:false};ws.seen=true;if(correct){const cleanFirst=appState.activeSession.attemptsOnQuestion===1&&!appState.activeSession.hintUsed;if(cleanFirst){ws.reviewNeeded=false;ws.mastered=true;ws.lastMastered=new Date().toISOString();}else{ws.reviewNeeded=true;ws.mastered=false;}}else{ws.reviewNeeded=true;ws.mastered=false;ws.lastWrong=new Date().toISOString();}appState.wordStats[w]=ws;}saveState();}
function addXP(q,amount){if(appState.xpAwardedQuestionIds.includes(q.id))return 0;appState.xpAwardedQuestionIds.push(q.id);appState.xp+=amount;appState.level=getLevelFromXP(appState.xp);for(const w of q.words||[]){const ws=appState.wordStats[w]||{seen:true,mastered:false,reviewNeeded:false};ws.encounteredCorrectly=true;appState.wordStats[w]=ws;}saveState();return amount;}
function finishCurrentQuestion(q,solved,choice){const s=appState.activeSession;if(s.doneCurrent)return;s.doneCurrent=true;s.answers.push({qid:q.id,solved:!!solved,choice:choice||'',attempts:s.attemptsOnQuestion,hintUsed:s.hintUsed,firstTryCorrect:!!(solved&&s.attemptsOnQuestion===1&&!s.hintUsed)});saveState();}

function completeSession(){const s=appState.activeSession;if(!s)return;const solved=s.answers.filter(a=>a.solved).length;const first=s.answers.filter(a=>a.firstTryCorrect).length;const previousLevel=s.levelBefore||1;let bonus=0;const milestone=`${s.mode}:${s.area}`;const cleared=s.mode!=='adventure'||solved>=6;if(s.mode==='adventure'&&cleared&&!appState.clearedMissions.includes(milestone)){bonus=20;appState.xp+=bonus;appState.clearedMissions.push(milestone);}if(s.mode==='adventure'&&solved>=6&&!appState.clearedAreas.includes(s.area)){appState.clearedAreas.push(s.area);}appState.level=getLevelFromXP(appState.xp);if(appState.level>previousLevel){const title=levelTitle(appState.level);if(!appState.earnedTitles.includes(title))appState.earnedTitles.push(title);}const sessionRecord={id:s.sessionId,mode:s.mode,area:s.area,startedAt:s.startedAt,finishedAt:new Date().toISOString(),total:s.questionIds.length,solved,firstTry:first,bonus,xpEarned:Math.max(0,appState.xp-(Number(s.xpStart)||0)),cleared,levelBefore:previousLevel,levelAfter:appState.level};appState.sessions.push(sessionRecord);appState.sessions=appState.sessions.slice(-300);appState.activeSession=null;saveState();page='result';window.scrollTo(0,0);render();}

function buildDictionary(){const map=new Map();for(const q of QUESTIONS){if(!map.has(q.word))map.set(q.word,{word:q.word,meaning:q.meaning,example:q.example,areas:[]});const entry=map.get(q.word);if(!entry.areas.includes(q.area))entry.areas.push(q.area);}return [...map.values()].sort((a,b)=>a.word.localeCompare(b.word,'ja'));}

function renderWeak(){const weak=weakList();return `<section class="panel"><div class="panel-head"><div><div class="section-label">もういちど やってみよう</div><h1 class="screen-title">にがてこくふく</h1><p class="muted">まちがえた もんだいを さきに だすよ。にている ちがう れいも まぜて れんしゅうするよ。</p></div><button class="soft-btn" data-action="home">ホームへ</button></div>${weak.length?`<div class="notice">ふくしゅうする もんだい：${weak.length}こ。せいかいした あとでも、また まちがえると ここに でてくるよ。</div><div class="history-list" style="margin:18px 0">${weak.slice(0,6).map(({q,s})=>`<div class="history-row"><div><strong>${esc(q.prompt)}</strong><small>${esc(getArea(q.area).name)} ・ まちがい ${Number(s.wrong)||0}かい</small></div><span class="word-status review">ふくしゅう</span></div>`).join('')}</div><div class="button-row"><button class="primary" data-action="startWeak">ふくしゅうを はじめる</button><button class="soft-btn" data-action="dictionary" data-filter="review">ことばずかんを みる</button></div>`:`<div class="empty-state"><div style="font-size:34px;margin-bottom:8px">🌱</div><strong>いまは、にがてな もんだいが ないよ。</strong><p>れんしゅうで まちがえた もんだいは、ここに でてくるよ。</p><button class="secondary" data-action="practice">れんしゅうする</button></div>`}</section>`;}
function renderHistory(){const attempts=appState.answerHistory||[];const total=attempts.length;const correct=attempts.filter(a=>a.correct).length;const wrong=total-correct;const sessions=appState.sessions||[];const last=sessions.slice().reverse().slice(0,12);const qCounts=Object.values(appState.questionStats||{});const need=qCounts.filter(s=>s.reviewNeeded).length;return `<section class="panel"><div class="panel-head"><div><div class="section-label">これまでの あしあと</div><h1 class="screen-title">がくしゅうきろく</h1><p class="muted">せいかいの かずだけでなく、どこを れんしゅうしたかも のこるよ。</p></div><button class="soft-btn" data-action="home">ホームへ</button></div><div class="history-grid"><div class="history-stat"><span class="muted">こたえた かいすう</span><strong>${total}</strong></div><div class="history-stat"><span class="muted">せいかい</span><strong>${correct}</strong></div><div class="history-stat"><span class="muted">ふくしゅう</span><strong>${need}</strong></div></div><div class="panel-head" style="margin-top:24px"><h2>さいきんの ぼうけん</h2></div>${last.length?`<div class="history-list">${last.map(s=>`<div class="history-row"><div><strong>${esc(getArea(s.area).name)} ・ ${s.solved}/${s.total}もん せいかい</strong><small>${formatDate(s.finishedAt)} ・ ${s.mode==='adventure'?'ぼうけん':s.mode==='weak'?'にがてこくふく':'れんしゅう'}</small></div><span class="area-state">${Math.round((Number(s.solved)||0)/Math.max(1,Number(s.total)||10)*100)}%</span></div>`).join('')}</div>`:'<div class="empty-state">まだ ぼうけんの きろくが ないよ。<br>さいしょの 10もんに ちょうせんしよう。</div>'}<div class="button-row" style="margin-top:20px"><button class="secondary" data-action="weak">にがてこくふくへ</button><button class="soft-btn" data-action="dictionary">ことばずかん</button></div></section>`;}
function renderSettings(){const audit=auditResult;return `<section class="panel"><div class="panel-head"><div><div class="section-label">あそびやすさと きろく</div><h1 class="screen-title">せってい</h1></div><button class="soft-btn" data-action="home">ホームへ</button></div><div class="setting-row"><div><strong>なまえ</strong><small>${esc(appState.playerName||'まだ とうろくなし')}</small></div><button class="soft-btn" data-action="rename">へんこう</button></div><div class="setting-row"><div><strong>おと</strong><small>せいかい・ふせいかいの おと</small></div><button class="toggle ${appState.soundOn?'on':''}" data-action="toggleSound" aria-pressed="${appState.soundOn}">${appState.soundOn?'ON':'OFF'}</button></div><div class="setting-row"><div><strong>うごきを すくなくする</strong><small>うごく えんしゅつを おさえる</small></div><button class="toggle ${appState.reduceMotion?'on':''}" data-action="toggleMotion" aria-pressed="${appState.reduceMotion}">${appState.reduceMotion?'ON':'OFF'}</button></div><div class="setting-row"><div><strong>もじチェック</strong><small>もんだいと こどもに みせる ことばを しらべる</small></div><button class="secondary" data-action="audit">チェックする</button></div>${audit?`<div class="notice ${audit.issues.length||audit.questionCheck.issues.length?'error':''}" role="status"><strong>チェックけっか</strong><br>しらべた ことば：${audit.checkedTextCount}<br>もじの きまり：${audit.issues.length?'かくにんが ひつよう':'もんだいなし'}<br>もんだいデータ：${audit.questionCheck.total}もん・${audit.questionCheck.issues.length?'しゅうせいが ひつよう':'ぜんぶ かくにんずみ'}${audit.issues.length?'<div style="margin-top:10px">'+audit.issues.slice(0,10).map(i=>`<p>${esc(i.text)}<br>しんぱいな もじ：${esc(i.bad)}<br>なおしかた：${esc(i.suggestion)}</p>`).join('')+'</div>':''}${audit.questionCheck.issues.length?'<div style="margin-top:10px">'+audit.questionCheck.issues.slice(0,12).map(i=>`<p>${esc(i.id)}：${esc(i.text)}</p>`).join('')+'</div>':''}</div>`:''}<div class="notice">ほぞんデータは このブラウザの なかに たまるよ。おなじ ブラウザ・おなじ ほぞんばしょで ひらいてね。</div><div class="setting-row"><div><strong>がくしゅうの きろくを リセット</strong><small>けいけんち、レベル、ずかん、きろくが きえるよ。</small></div><button class="danger-btn" data-action="reset">リセット</button></div><div class="button-row" style="margin-top:18px"><button class="soft-btn" data-action="history">がくしゅうきろく</button><button class="soft-btn" data-action="dictionary">ことばずかん</button></div></section>`;}
function playTone(good){if(!appState.soundOn)return;try{const AudioContext=window.AudioContext||window.webkitAudioContext;if(!AudioContext)return;const ctx=new AudioContext();const osc=ctx.createOscillator();const gain=ctx.createGain();osc.type='sine';osc.frequency.value=good?740:260;gain.gain.setValueAtTime(.0001,ctx.currentTime);gain.gain.exponentialRampToValueAtTime(.08,ctx.currentTime+.025);gain.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+.18);osc.connect(gain);gain.connect(ctx.destination);osc.start();osc.stop(ctx.currentTime+.19);osc.onended=()=>ctx.close();}catch(_e){}}
function handleAction(action,el){
 if(action==='saveName'){const input=document.getElementById('playerName');const name=sanitizeName(input?input.value:'');if(!name){const e=document.getElementById('nameError');if(e)e.textContent='ひらがなか カタカナで なまえを いれてね。';return;}appState.playerName=name;saveState();setPage('home');return;}
 if(action==='rename'){page='welcome';render();return;}
 if(action==='home'){if(page==='question'&&appState.activeSession){if(!confirm('いまの ぼうけんを やめて、ホームへ もどる？ こたえた きろくは のこるよ。'))return;appState.activeSession=null;saveState();}setPage(appState.playerName?'home':'welcome');return;}
 if(action==='settings'){setPage('settings');return;}
  if(action==='shop'){setPage('shop');return;}
  if(action==='buyBackground'){
   const item=CAMP_BACKGROUNDS.find(x=>x.id===el.dataset.background);
   if(!item||(appState.ownedBackgrounds||[]).includes(item.id))return;
   if((Number(appState.coins)||0)<item.cost){storageWarning='コインが たりないよ。もんだいに せいかいして ためよう。';render();return;}
   appState.coins=Math.max(0,Math.floor(Number(appState.coins)||0)-item.cost);
   appState.ownedBackgrounds.push(item.id);appState.equippedBackground=item.id;
   storageWarning='';saveState();render();return;
  }
  if(action==='equipBackground'){
   const item=CAMP_BACKGROUNDS.find(x=>x.id===el.dataset.background);
   if(item&&(appState.ownedBackgrounds||[]).includes(item.id)){appState.equippedBackground=item.id;storageWarning='';saveState();render();}
   return;
  }
  if(action==='buyTent'){
   const item=CAMP_TENTS.find(x=>x.id===el.dataset.tent);
   if(!item||(appState.ownedTents||[]).includes(item.id))return;
   if((Number(appState.level)||1)<item.level){storageWarning=`この テントは レベル ${item.level}で かえるよ。`;render();return;}
   if((Number(appState.coins)||0)<item.cost){storageWarning='コインが たりないよ。もんだいに せいかいして ためよう。';render();return;}
   appState.coins=Math.max(0,Math.floor(Number(appState.coins)||0)-item.cost);
   appState.ownedTents.push(item.id);appState.equippedTent=item.id;
   storageWarning='';saveState();render();return;
  }
  if(action==='equipTent'){
   const item=CAMP_TENTS.find(x=>x.id===el.dataset.tent);
   if(item&&(appState.ownedTents||[]).includes(item.id)&&(Number(appState.level)||1)>=item.level){appState.equippedTent=item.id;storageWarning='';saveState();render();}
   return;
  }
  if(action==='buyShopItem'){
  const item=getShopItem(el.dataset.item);
  if(!item||isShopItemOwned(item.id))return;
  if((Number(appState.coins)||0)<item.cost){storageWarning='コインが たりないよ。もんだいに せいかいして ためよう。';render();return;}
  appState.coins=Math.max(0,Math.floor(Number(appState.coins)||0)-item.cost);
  appState.ownedShopItems.push(item.id);
  equipShopItem(item.id);
  storageWarning='';
  saveState();render();return;
 }
 if(action==='equipShopItem'){
  if(equipShopItem(el.dataset.item)){storageWarning='';saveState();render();}
  return;
 }
 if(action==='unequipShopItem'){
  const item=getShopItem(el.dataset.item);
  if(item&&isShopItemOwned(item.id)&&isShopItemEquipped(item)){delete appState.equippedShopItems[item.slot];saveState();render();}
  return;
 }
 if(action==='adventure'){selectedMode='adventure';setPage('areas');return;}
 if(action==='practice'){selectedMode='practice';setPage('areas');return;}
 if(action==='selectArea'){const area=el.dataset.area;const idx=AREA_INFO.findIndex(a=>a.id===area);const unlockCount=1+Math.max(-1,...AREA_INFO.map((a,i)=>appState.clearedAreas.includes(a.id)?i:-1));if(selectedMode==='adventure'&&idx>unlockCount)return;selectedArea=area;startGame(selectedMode,area);return;}
 if(action==='answer'){onAnswer(el.dataset.choice);return;}
 if(action==='sortSelect'){onSortSelect(el.dataset.choice);return;}
 if(action==='sortBucket'){onSortBucket(el.dataset.bucket);return;}
 if(action==='showHint'||action==='hintQuick'){showHint();return;}
 if(action==='retry'){retryQuestion();return;}
 if(action==='reveal'){revealAnswer();return;}
 if(action==='nextQuestion'){nextQuestion();return;}
 if(action==='exitGame'){handleAction('home',el);return;}
 if(action==='dictionary'){dictionaryFilter=el.dataset.filter||'all';setPage('dictionary');return;}
 if(action==='dictFilter'){dictionaryFilter=el.dataset.filter||'all';render();return;}
 if(action==='history'){setPage('history');return;}
 if(action==='weak'){setPage('weak');return;}
 if(action==='startWeak'){const ids=chooseWeakQuestions();startGame('weak',ids.length?getQuestion(ids[0]).area:'forest',ids);return;}
 if(action==='retryArea'){const last=appState.sessions[appState.sessions.length-1];if(last)startGame('adventure',last.area);return;}
 if(action==='toggleSound'){appState.soundOn=!appState.soundOn;saveState();render();return;}
 if(action==='toggleMotion'){appState.reduceMotion=!appState.reduceMotion;document.documentElement.style.setProperty('--motion',appState.reduceMotion?'0':'1');saveState();render();return;}
 if(action==='audit'){auditResult=runTextAudit();render();return;}
 if(action==='reset'){if(!confirm('ほんとうに リセットする？ けいけんちや ずかん、きろくが ぜんぶ きえるよ。'))return;try{localStorage.removeItem(STORAGE_KEY);}catch(_e){}appState=DEFAULT_STATE();auditResult=null;storageWarning='';setPage('welcome');return;}
}
document.getElementById('app').addEventListener('click',event=>{const el=event.target.closest('[data-action]');if(!el||el.disabled)return;handleAction(el.dataset.action,el);});
window.addEventListener('beforeunload',()=>{if(appState)saveState();});
init();
</script>
</body>
</html>
