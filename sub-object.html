"夕方[ゆうがた]:t 学校[がっこう]の:m 花[はな]だんで:w ゆかりさんが:s 小[ちい]さな:m 花[はな]を:o 見[み]つけた:p",
"あさ:t うちの:m 屋根[やね]に:w 黒[くろ]い:m ねこが:s じっと:h すわる:p",
"きょう:t 図工[ずこう]の:m 時間[じかん]に:t みんなが:s 色[いろ]とりどりの:m 紙[かみ]を:o 切[き]った:p",
"はるの:m 野原[のはら]で:w 黄色[きいろ]い:m ちょうが:s 花[はな]の:m まわりを:w とびまわる:p",
"まいばん:t わたしは:s 自分[じぶん]の:m へやで:w お気に入[い]りの:m 本[ほん]を:o 読[よ]む:p"]};
const ALL=[];for(const l in RAW)RAW[l].forEach(r=>ALL.push({raw:r,n:r.split(' ').length}));
const R=['みならいハンター','ひよこハンター','かけだしハンター','ことばハンター','一[いち]にんまえハンター','するどいハンター','ベテランハンター','ダンジョンハンター','名人[めいじん]ハンター','しんそうのハンター','でんせつのハンター','文[ぶん]のおうさま'],TH=[0,40,100,180,290,430,600,800,1050,1350,1700,2100];
const IT=[{id:'forest',e:'🌲',n:'くらいもり',c:30,b:'linear-gradient(#0f2a1a,#071409)'},{id:'ice',e:'🧊',n:'こおりのどうくつ',c:40,b:'linear-gradient(#10324a,#07131f)'},{id:'lava',e:'🌋',n:'ようがん',c:50,b:'linear-gradient(#5a1a0a,#1a0805)'},{id:'sky',e:'🌌',n:'ほしぞら',c:60,b:'linear-gradient(#2b1a5a,#0a0716)'},
{id:'fox',e:'🦊',n:'きつね',c:20},{id:'bear',e:'🐻',n:'くま',c:20},{id:'ribbon',e:'🎀',n:'リボン',c:25},{id:'clover',e:'🍀',n:'クローバー',c:25},{id:'owl',e:'🦉',n:'ふくろう',c:30},{id:'star',e:'🌟',n:'ほし',c:40},{id:'bow',e:'🏹',n:'ゆみや',c:50},{id:'cup',e:'🏆',n:'トロフィー',c:80}];
const M=[{id:'s',t:'主語[しゅご]を5かい見[み]つける',n:5},{id:'p',t:'述語[じゅつご]を5かい見[み]つける',n:5},{id:'f',t:'B5Fまでもぐる',n:5}];
const $=i=>document.getElementById(i),rb=s=>s.replace(/([一-龠々]+)\[([^\]]+)\]/g,'<ruby>$1<rt>$2</rt></ruby>');
const P=s=>s.split(' ').map(t=>{const i=t.lastIndexOf(':');return{t:t.slice(0,i),k:t.slice(i+1)}});
const cl=t=>t.replace('。',''),nm=t=>cl(t).replace(/[はが]$/,''),isP=k=>/[pqn]/.test(k);
let S={xp:0,coins:0,best:0,deep:0,own:[],bg:'',nb:[],day:'',m:{s:0,p:0,f:0,d:{}}};
try{Object.assign(S,JSON.parse(localStorage.getItem('shugo_ft')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('shugo_ft',JSON.stringify(S))}catch(e){}};
const td=new Date().toISOString().slice(0,10);if(S.day!==td){S.day=td;S.m={s:0,p:0,f:0,d:{}}}
let run,cur,streak=0;
const rank=()=>{let r=0;TH.forEach((t,i)=>{if(S.xp>=t)r=i});return r};
function toast(t){const d=document.createElement('div');d.className='toast';d.innerHTML=rb(t);document.body.appendChild(d);setTimeout(()=>d.remove(),2400)}
function mis(id,v){if(id==='f')S.m.f=Math.max(S.m.f||0,v);else S.m[id]=(S.m[id]||0)+1;M.forEach(m=>{if(!S.m.d[m.id]&&(S.m[m.id]||0)>=m.n){S.m.d[m.id]=1;S.coins+=20;toast('ミッションたっせい！ +20🪙')}})}
function home(){const r=rank(),nx=TH[r+1],pc=nx?Math.round((S.xp-TH[r])/(nx-TH[r])*100):100,bg=(IT.find(i=>i.id===S.bg)||{}).b||'',de=IT.filter(i=>!i.b&&S.own.includes(i.id)).map(i=>i.e).join(' ');
$('app').innerHTML=rb(`<h1>🏹 主語[しゅご]と述語[じゅつご]ハンター<small>ふしぎなぶんのダンジョン</small></h1>
<div class=stats><div class="big gd"><small>🪙 もっているコイン</small><b>${S.coins}</b></div><div class="big dp"><small>🕳 いちばん深[ふか]くもぐった</small><b>B${S.deep||0}F</b></div></div>
<div class=card><div class=row><span class=badge>Lv.${r+1} ${R[r]}</span><span>⭐ ${S.xp}XP</span></div>
<div class=bar><i style="width:${pc}%"></i></div><div style="text-align:center">${nx?'つぎの称号[しょうごう]まで あと '+(nx-S.xp)+'XP → 「'+R[r+1]+'」':'さいこうの称号[しょうごう]！'}</div></div>
<button class=go onclick=enter()>⚔ ダンジョンに もぐる！<br><small>B1Fから スタート。ハートは 3つ</small></button>
<div class=room style="${bg?'background:'+bg:''}">${de||''}</div>
<div class=row><button class=alt onclick=notebook()>📒 まちがいノート（${S.nb.length}）</button></div>
<div class=card><div style="font-size:1.2rem">📅 きょうのミッション</div>${M.map(m=>`<div class=nb style="${S.m.d[m.id]?'text-decoration:line-through;':''}">${m.t}（${Math.min(S.m[m.id]||0,m.n)}/${m.n}）</div>`).join('')}</div>`)}
function enter(){run={f:1,hp:3,coins:0,xp:0,ok:0,t:0,used:[],redo:[],r0:rank()};streak=0;floor()}
const tl=f=>f<=3?2:f<=7?3:f<=12?4:f<=18?5:f<=24?6:7;
function floor(){const f=run.f,t=tl(f);run.t++;let q;const ri=run.redo.findIndex(e=>e.due<=run.t);
if(ri>=0){const e=run.redo.splice(ri,1)[0];q={k:e.k,a:e.a,rev:1}}
else if(S.nb.length&&f>=2&&Math.random()<.2){const e=S.nb[Math.random()*S.nb.length|0];q={k:e.k,a:e.a,rev:1}}
else{const all=ALL.map((s,i)=>i).filter(i=>ALL[i].n===t);let ps=all.filter(i=>!run.used.includes(i));if(!ps.length){run.used=[];ps=all}
const k=ps[Math.random()*ps.length|0];run.used.push(k);const b=f>=8&&Math.random()<(f>=14?.8:.5);q={k,a:b?'B':(Math.random()<.5?'S':'P')}}
cur={q,st:0};show()}
function show(){const{q,st}=cur,tk=P(ALL[q.k].raw),a=q.a==='B'?(st?'P':'S'):q.a,f=run.f;Object.assign(cur,{tk,a,done:0});
$('app').innerHTML=rb(`<div class=hud><div class=hp>${'❤️'.repeat(run.hp)}${'🖤'.repeat(3-run.hp)}</div><div class=fl style="color:hsl(${(20+f*22)%360},95%,66%)"><small>ふかさ</small>B${f}F</div><div class=cn>🪙${S.coins}</div></div>
<div style="text-align:center;color:var(--sub);margin-top:6px">${q.rev?'📒 まちがいの ふくしゅう！':'ことば '+ALL[q.k].n+'こ の 文[ぶん]'}　<button class=sm onclick=over()>🚪 ひきかえす</button></div>
<div class=ask>${a==='S'?'主語[しゅご]を見[み]つけよう！':'述語[じゅつご]を見[み]つけよう！'}</div>
<div class=sent>${tk.map((t,i)=>`<button class="w ${st&&t.k==='s'?'S':''}" onclick=ans(${i})>${t.t}</button>`).join('')}</div><div id=fb></div>`)}
function cmt(tk,c,a,ok){const x=tk[c],n='「'+cl(x.t)+'」',s=tk.find(t=>t.k==='s'),p=tk.find(t=>isP(t.k)),sm='「'+nm(s.t)+'」',pn='「'+cl(p.t)+'」';
const kd={p:'どうするのか',q:'どんなようすなのか',n:'何[なに]なのか'}[p.k],L={m:'どんな',w:'どこで・どこに',o:'何[なに]を',h:'どのように',t:'いつ',c:'だれと'};
if(ok&&a==='S')return`${['やったね！','すごい！','その通[とお]り！','ナイスハント！'][Math.random()*4|0]}${n}は、「だれが・何[なに]が」をあらわすことばだね。これが主語[しゅご]だよ。`;
if(ok)return`せいかい！${n}は、${sm}が${kd}をあらわすことばだよ。これが述語[じゅつご]だね。`+(p.k==='q'?`<em>${n}のように、うごきではなく「ようす」をあらわす述語[じゅつご]もあるよ。</em>`:p.k==='n'?`<em>「〜だ」で「何[なに]か」をあらわす述語[じゅつご]もあるよ。</em>`:'');
if(a==='S'){let t=isP(x.k)?`${n}は、「どうする・どんなだ・何[なに]だ」をあらわすことばだよ。これは述語[じゅつご]だね。主語[しゅご]は「だれが・何[なに]が」をあらわすことばだよ。`:`${n}は、「${L[x.k]}」をあらわすことばだよ。「だれが・何[なに]が」をあらわすことばではないから、主語[しゅご]ではないよ。`;return t+`<em>この文[ぶん]で「だれが・何[なに]が」なのは ${s.t.replace(/[。]/,'')} だよ。</em>`}
let t=x.k==='s'?`${n}は、「だれが・何[なに]が」をあらわすことばだよ。これは主語[しゅご]だね。述語[じゅつご]は「どうする・どんなだ・何[なに]だ」をあらわすことばだよ。`:`${n}は、「${L[x.k]}」をあらわすことばだよ。「どうする・どんなだ・何[なに]だ」をあらわすことばではないから、述語[じゅつご]ではないよ。`;
return t+`<em>${sm}が${kd}をあらわすのは ${pn} だよ。</em>`}
function ans(i){if(cur.done)return;cur.done=1;const{q,tk,a,st}=cur,ok=a==='S'?tk[i].k==='s':isP(tk[i].k),bs=document.querySelectorAll('.w'),f=run.f;
bs.forEach((b,j)=>{b.disabled=true;if(a==='S'&&tk[j].k==='s')b.classList.add('S');if(a==='P'&&isP(tk[j].k))b.classList.add('P')});if(!ok)bs[i].classList.add('bad');
let ex='',x=1,c=0,fin=true,link='';
if(ok){streak++;S.best=Math.max(S.best||0,streak);x=4+f;c=2+f;if(streak>=3){const b=Math.min(15,streak*2);c+=b;ex+=`🔥 れんぞくボーナス +${b}🪙 `}if(q.rev){c+=5;ex+='📒 ふくしゅうせいこう +5🪙 '}mis(a==='S'?'s':'p');if(q.a==='B'&&!st)fin=false}
else{streak=0;run.hp--;q.bad=1;ex='ハートが 1つ へったよ。でも だいじょうぶ！ この もんだいは ノートに のこして、あとで もういちど ちょうせんするよ。'}
S.coins+=c;run.coins+=c;S.xp+=x;run.xp+=x;cur.fin=fin;
if(fin){if(q.bad){if(!S.nb.some(e=>e.k===q.k&&e.a===q.a)&&S.nb.length<30)S.nb.push({k:q.k,a:q.a});if(!q.rev)run.redo.push({k:q.k,a:q.a,due:run.t+3})}
else{S.nb=S.nb.filter(e=>!(e.k===q.k&&e.a===q.a));run.ok++;run.f++;mis('f',run.f);if(q.a==='B'){const s=tk.find(t=>t.k==='s'),p=tk.find(t=>isP(t.k));link=`<em>つなげてみよう： 「${nm(s.t)}」→「${cl(p.t)}」。主語[しゅご]と述語[じゅつご]は ペアだよ。</em>`}}}
save();const bt=!fin?'つぎは 述語[じゅつご]へ ➡':ok?'さらに深[ふか]くもぐる！ ➡':run.hp>0?'もういちど ちょうせん ➡':'ゲームオーバー…';
$('fb').innerHTML=rb(`<div class="fb ${ok?'ok':'ng'}">${ok?'🎯':'💡'} ${cmt(tk,i,a,ok)}<em>${ex}（${x?'+'+x+'XP ':''}${c?'+'+c+'🪙':''}）</em>${link}</div><div class=row><button class="${ok?'go':''}" style="${ok?'width:100%;padding:14px;font-size:1.5rem':''}" onclick=nx()>${bt}</button></div>`)}
function nx(){if(!cur.fin){cur.st=1;return show()}run.hp<=0?over():floor()}
function over(){const f=run.f,b=(f-1)*5,old=S.deep||0,rec=f>old,rk=rank();S.coins+=b;S.deep=Math.max(old,f);save();const up=rank()>run.r0;
$('app').innerHTML=rb(`<div class=over>GAME OVER</div><div class="card res"><div class=px style="font-size:2rem;color:#8fd3ff">B${f}F まで とうたつ！</div>${rec?'<div style="color:var(--gold)">🏆 しんきろく！</div>':''}
<div class="big gd"><small>🪙 ほうしゅう</small><b>+${run.coins+b}</b></div>
ゆかで ひろった 🪙${run.coins} ＋ もぐったボーナス 🪙${b}<br>⭐ +${run.xp}XP　クリアした かいそう ${run.ok}<br>${up?'🌟 ランクアップ！ 「'+R[rank()]+'」になったよ！<br>':''}もっているコイン 🪙${S.coins}</div>
<div class=row><button class=go style="width:auto" onclick=enter()>⚔ もういちど もぐる</button><button class=alt onclick=home()>🚪 入口[いりぐち]へ</button></div>`)}
function notebook(){$('app').innerHTML=rb(`<h1>📒 まちがいノート</h1><div class=card>${S.nb.length?S.nb.map(e=>`<div class=nb>${e.a==='B'?'主語[しゅご]と述語[じゅつご]':e.a==='S'?'主語[しゅご]':'述語[じゅつご]'}：${P(ALL[e.k].raw).map(t=>t.t).join('')}</div>`).join('')+'<div class=nb style="color:var(--sub)">ここの もんだいは、ダンジョンで また出[で]てくるよ。ただしく こたえると ノートから きえるよ！</div>':'からっぽ！ すごい！'}</div><div class=row><button class=alt onclick=home()>🏠 ホーム</button></div>`)}
function shop(){$('app').innerHTML=rb(`<h1>🎁 おたから</h1><div class=card style="text-align:center;font-size:1.6rem;padding:36px 14px">じゅんびちゅう</div><div class=row><button class=alt onclick=home()>🏠 ホーム</button></div>`)}
function buy(id){const i=IT.find(v=>v.id===id),o=S.own.includes(id);if(o){if(i.b)S.bg=id}else if(S.coins>=i.c){S.coins-=i.c;S.own.push(id);if(i.b)S.bg=id}else toast('コインが たりないよ');save();shop()}
home();
</script></body></html>
